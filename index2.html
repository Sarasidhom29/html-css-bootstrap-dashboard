<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./style/index.css">
</head>

<body>
    <!--intetstazione pagina-->

    <nav>
        <img src="./img/duck.png" alt="logo di una paperella bianche su sfondo fucsia">
        <ul class="nav-options">
            <li class="nav-option">
                Anagrafica Utenti
            </li>
            <li class="nav-option">

            </li>
            <li class="nav-option">

            </li>
        </ul>

    <header>

    <main>
        <div class="container-fluid">
            <div class="row">

                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="1">Inserisci il nome dell'autore</textarea>

                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="1">Inserisci il nome dell'autore</textarea>
                </div>

                    <label for="exampleFormControlTextarea1" class="form-label">Titolo</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="1">Inserisci il titolo del libro</textarea>
