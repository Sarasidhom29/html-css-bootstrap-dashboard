<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuovo Libro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./style/index.css">
</head>

<body>
    <!--intetstazione pagina-->

    <nav>
        <img src="./img/duck.png" alt="logo di una paperella bianche su sfondo fucsia">
        <ul class="nav-options">
            <li class="nav-option">
                Anagrafica Utenti
            </li>
            <li class="nav-option">
                Storico Prestiti
            </li>
            <li class="nav-option">
                Help
            </li>
        </ul>

        <button class="nav-btn">
            <i class="bi bi-list"></i>
        </button>
    </nav>

    <header>
        <h1 class="new-book">
            Nuovo Libro
        </h1>
    </header>

    <main>
        <div class="container-fluid">
            <div class="row">
                <!--primi 3 form-->
                <div class="col-6 mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Nome Autore</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1"
                        rows="1">Inserisci il nome dell'autore</textarea>
                </div>
                <div class="col-6 mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Cognome Autore</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1"
                        rows="1">Inserisci il nome dell'autore</textarea>
                </div>
                <div class="col-12 mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Titolo</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1"
                        rows="1">Inserisci il titolo del libro</textarea>
                    <p>Titolo versione italiana</p>
                </div>
                <!--altre info libro-->
                <p>Genere</p>
                <select class="form-select" aria-label="Default select example">
                    <option selected>Scegli il genere</option>
                    <option value="1">Giallo</option>
                    <option value="2">Horror</option>
                    <option value="3">Romantico</option>
                </select>

                <div class=" mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Anno di Pubblicazione</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1"
                        rows="1">Inserisci l'anno</textarea>
                </div>

                <div class="col-12 mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">ISBN#</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1"
                        rows="1">Inserisci il codice ISBN#</textarea>
                </div>

                <hr>
                <!--note-->

                <div class=" mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Note</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1"
                        rows="3">Inserisci eventuali note sul libro</textarea>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
                    <label class="form-check-label" for="checkChecked">
                        Disponibile anche in digitale
                    </label>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Aggiungi Libro</button>
                </div>

            </div>
        </div>

    </main>

</body>

</html>
